kind = "web"
previewPath = "/"
title = "Resource Aid & Grants"
version = "1.0.0"
id = "artifacts/grants-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22638

[services.development]
run = "pnpm --filter @workspace/grants-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grants-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/grants-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22638"
BASE_PATH = "/"
